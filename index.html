<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso · El ruido en el trabajo</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--txt:#1b2333;--mut:#5b6578;--pri:#0f7b6c;--pri2:#14b8a6;--acc:#f59e0b;--bd:#e3e7ef;--ok:#16a34a;--ko:#dc2626;--hl:#fff7d6}
[data-theme=dark]{--bg:#0e1420;--card:#172033;--txt:#e7ecf5;--mut:#9aa6bd;--pri:#2dd4bf;--pri2:#14b8a6;--bd:#26324a;--hl:#3a3418}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:1rem;margin:0;flex:1}
.prog{flex:2;max-width:320px;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .5s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:10px;padding:7px 12px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:#fff;border:none}[data-theme=dark] .btn{color:#06201c}
.wrap{display:flex;max-width:1200px;margin:auto}
nav{width:270px;padding:16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav a{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:4px;cursor:pointer}
nav a.on{background:var(--pri);color:#fff}[data-theme=dark] nav a.on{color:#06201c}nav a .ck{margin-left:auto}
main{flex:1;padding:20px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#0f7b6c,#0e4f74);color:#fff;border-radius:20px;padding:40px 28px;position:relative;overflow:hidden}
.hero h2{font-size:2rem;margin:.2em 0}.wave{position:absolute;right:-20px;bottom:-10px;opacity:.25;font-size:9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0000000a}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000018}
.tag{display:inline-block;font-size:.75rem;background:var(--pri2);color:#fff;border-radius:99px;padding:2px 10px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none}summary::after{content:"＋";float:right}details[open] summary::after{content:"－"}
details>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.q{margin:14px 0}.q p{font-weight:600;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none}
.fb{font-size:.9rem;min-height:1.2em}.score{font-size:1.2rem;font-weight:700}
.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:1.3rem;text-align:center;padding:12px;background:var(--bg);border-radius:10px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}.frac span:first-child{border-bottom:1px solid currentColor}
.warn{color:var(--ko);font-size:.9rem}.pn{display:flex;justify-content:space-between;margin-top:24px}
.pend{background:color-mix(in srgb,var(--ko) 10%,var(--card));border:1px dashed var(--ko);padding:8px 12px;border-radius:10px}
figure{margin:10px 0;text-align:center}figure img,.slide img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.car{position:relative;overflow:hidden;border-radius:14px;outline:none}.track{display:flex;transition:transform .45s ease}.slide{min-width:100%;padding:4px 44px;text-align:center}
.cp,.cn{position:absolute;top:45%;font-size:1.6rem;width:40px;height:40px;border-radius:50%;padding:0;background:var(--pri);color:#fff;border:none}.cp{left:2px}.cn{right:2px}
.dots{text-align:center;margin-top:8px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;margin:0 3px;background:var(--bd);border:none}.dots button.on{background:var(--pri)}
.lb{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fade .25s}.lb img{max-width:95vw;max-height:92vh;border-radius:8px;background:#fff}.lb button{position:fixed;top:12px;right:12px}
.linkbtn{display:inline-block;text-decoration:none;padding:10px 16px;border-radius:10px;margin:6px 0}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px}nav details.ng summary small{color:var(--mut);font-weight:400}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--card);transition:background .2s}.chip.sel{background:color-mix(in srgb,var(--pri) 18%,var(--card));border-color:var(--pri)}.ch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fl{display:block;margin:10px 0;font-weight:600}.fl input,.fl select{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.wzp{display:flex;gap:12px;align-items:center;font-size:.85rem;color:var(--mut)}.info{border:none;background:none;padding:0 4px;font-size:1.1rem}.helpbox{background:color-mix(in srgb,var(--pri2) 12%,var(--card));border-radius:10px;padding:10px 12px;margin-bottom:8px}
.tg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}@media(max-width:700px){.tg{grid-template-columns:1fr}}.trow{margin:8px 0;padding:12px}
.hlrow td{background:color-mix(in srgb,var(--acc) 22%,var(--card));font-weight:600}.warnc{border-left:5px solid var(--ko)}.ps{margin:18px 0}.pmeta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut)}.ck2{list-style:none;padding-left:0}.ck2 li{margin:6px 0}.purl{display:none}.pfoot{font-size:.8rem;color:var(--mut)}
@media print{header,nav,.noprint,.linkbtn{display:none!important}.purl{display:block}body{background:#fff;color:#000}main{padding:0}.wrap{display:block}.card,.ps{box-shadow:none;break-inside:avoid}th{background:#eee!important}.hlrow td{background:#fde68a!important}*{animation:none!important}}
#menu{display:none}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
@media(max-width:860px){nav{position:fixed;left:0;top:56px;background:var(--card);z-index:9;transform:translateX(-100%);transition:transform .3s;border-right:1px solid var(--bd)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}.hero h2{font-size:1.5rem}}

/* ===== Rediseño corporativo ===== */
:root{--bg:#eef2f6;--card:#fff;--txt:#14213d;--mut:#55627a;--pri:#0b4f6c;--pri2:#0e7490;--acc:#f5a623;--bd:#dbe2ea;--navy:#0a1f33;--navy2:#0f3550}
[data-theme=dark]{--bg:#08121d;--card:#102031;--txt:#e6edf5;--mut:#9aabc0;--pri:#38bdf8;--pri2:#0e7490;--acc:#fbbf24;--bd:#1f3348;--navy:#050d16;--navy2:#0b2a40}
body{font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
background-color:var(--bg);
background-image:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 14%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--acc) 8%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);
background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc);box-shadow:0 4px 18px #0003}
header h1{font-weight:700;letter-spacing:.02em}header button{background:#ffffff14;border-color:#ffffff30;color:#fff}
header .prog{background:#ffffff26}header #pct{font-size:.85rem;opacity:.9}
.btn{background:var(--pri);color:#fff;font-weight:600;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
[data-theme=dark] .btn{color:#04121d}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
nav{background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(6px)}
.card{border-radius:14px;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.tag{background:color-mix(in srgb,var(--pri2) 16%,var(--card));color:var(--pri2);font-weight:600;letter-spacing:.03em;border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
[data-theme=dark] .tag{color:#7dd3fc}
.hero{background:linear-gradient(135deg,var(--navy2),#0b4f6c 55%,#0e7490);border-radius:18px;box-shadow:0 14px 40px #0a1f3340}
.hero .tag{background:#ffffff1f;color:#fff;border-color:#ffffff40}
h2,h3,h4{letter-spacing:-.01em}
/* portada */
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:44px 36px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,#0b5a78 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center}
.hx::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--acc) 0 14px,#111 14px 28px)}
.hx>*{position:relative}
.hx .eyb{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hx .eyb::before{content:"";width:26px;height:2px;background:var(--acc)}
.hx h2{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.05;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:var(--acc)}
.hx p.sub{font-size:1.08rem;color:#d5e3ef;max-width:560px;margin:0 0 22px}
.hx .cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hx .go{background:var(--acc);color:#1a1300;border:none;font-weight:700;padding:13px 24px;border-radius:12px;font-size:1.02rem;box-shadow:0 8px 24px #f5a62355}
.hx .go2{background:transparent;color:#fff;border:1px solid #ffffff55;padding:12px 18px;border-radius:12px}
.hx .pbar{margin-top:18px;max-width:420px}.hx .pbar small{color:#b9cddd}.hx .pbar div{height:8px;border-radius:9px;background:#ffffff22;overflow:hidden;margin-top:4px}.hx .pbar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,var(--acc))}
.meter{width:100%;max-width:380px;justify-self:center}
.meter .bars rect{fill:url(#gb);transform-origin:bottom;transform-box:fill-box;animation:eq 1.6s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.meter .wv{animation:dash 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-400}}
.meter .ndl{transform-origin:150px 150px;animation:sw 4s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(22deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--pri2)}
.stat b{display:block;font-size:1.7rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.mc:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0a1f331f}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 22%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.08rem}.mc p{margin:0;color:var(--mut);font-size:.9rem}
.mc .mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mc .mp i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--acc))}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:30px 20px 34px}.meter{max-width:260px;order:-1}.mods{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{background:var(--card)}.hx h2{font-size:2rem}}
@media(prefers-reduced-motion:reduce){.meter *{animation:none!important}}
@media print{body{background:#fff!important}header{display:none}}

/* ===== Identidad PREVIJOB ===== */
:root{--pri:#0291CE;--pri2:#009CD7;--acc:#16B14C;--navy:#06476b;--navy2:#0277ab;--bg:#eef5f9;--txt:#1d2b36;--bd:#d6e4ec}
[data-theme=dark]{--pri:#2bb3ea;--pri2:#009CD7;--acc:#2fcf66;--navy:#041e2e;--navy2:#06476b;--bg:#06131c;--card:#0d2130;--bd:#1b3a4e}
h1,h2,h3,h4,.hx h2,.stat b,.mc .n,summary,.btn,.go,.go2{font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{border-bottom-color:var(--acc)}
.btn,.hx .go,.hx .go2{border-radius:9999px}
.btn{background:var(--pri)}
.hx .go{background:var(--acc);color:#fff;box-shadow:0 8px 24px #16b14c55}
.hx .eyb{color:#7fe3a0}.hx .eyb::before{background:var(--acc)}.hx h2 em{color:#7fe3a0}
.hx{background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%)}
.hx::after{background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx .pbar i,.mc .mp i,.prog i{background:linear-gradient(90deg,#009CD7,#16B14C)}
.stat{border-top-color:var(--acc)}
.key{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.hlrow td{background:color-mix(in srgb,var(--acc) 20%,var(--card))}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003}
header h1{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){header h1 span{display:none}.logo-h{height:30px}.logo-x{height:44px}}
</style>
</head>

"use strict";
const L=[
{t:"Definición y tipos de ruido",ico:"🎧",obj:["Definir qué es el ruido y explicar por qué es un riesgo laboral.","Distinguir entre ruido estable, variable y de impacto.","Relacionar cada tipo de ruido con la dificultad de medirlo y controlarlo."],
b:[["1. ¿Qué es el ruido?","<p>El ruido es cualquier sonido no deseado o molesto que interfiere en nuestras actividades. En el trabajo no es solo una molestia: afecta a la salud y a la seguridad.</p>"],
["2. ¿Por qué importa?","<p>Exponerse mucho tiempo a niveles altos de ruido puede causar pérdida de audición, estrés, fatiga y problemas cardiovasculares. Además, el ruido dificulta la concentración y la comunicación, y eso aumenta el riesgo de accidentes.</p>"],
["3. Tipos de ruido",'<div class="tbl"><table><tr><th>Tipo</th><th>Cómo es</th><th>Ejemplos</th><th>Medición y control</th></tr><tr><td>Estable</td><td>Nivel de presión sonora constante en el tiempo</td><td>Motor eléctrico, máquina que funciona toda la jornada</td><td>El más fácil de medir y controlar, pero dañino si hay exposición prolongada sin protección</td></tr><tr><td>Variable</td><td>Su intensidad fluctúa, de forma periódica o aleatoria</td><td>Sierra cortando materiales de distinta densidad, línea de producción con máquinas que arrancan, paran o cambian de velocidad</td><td>Requiere medir en distintos momentos y condiciones para obtener un valor representativo</td></tr><tr><td>De impacto</td><td>Sucesos breves pero muy intensos</td><td>Martillo neumático, prensa mecánica, golpes, explosiones</td><td>Puede causar daño auditivo instantáneo; necesita equipos capaces de captar los picos</td></tr></table></div>']],
key:"Identificar bien el tipo de ruido es el primer paso para elegir cómo medirlo y qué medidas preventivas aplicar.",
q:[["El ruido se define como:",["Cualquier sonido por encima de 80 dB","Cualquier sonido no deseado o perturbador","Solo el sonido producido por máquinas"],1],
["El zumbido continuo de un motor que funciona todo el día es ruido:",["Estable","Variable","De impacto"],0],
["¿Qué tipo de ruido puede provocar daño auditivo instantáneo?",["Estable","Variable","De impacto"],2],
["¿Por qué el ruido variable es más difícil de medir?",["Porque siempre es más fuerte","Porque hay que medir en distintos momentos y condiciones","Porque no se puede medir con sonómetro"],1],
["Además de dañar el oído, el ruido aumenta el riesgo de accidentes porque:",["Dificulta la concentración y la comunicación","Hace que las máquinas fallen","Reduce la iluminación"],0]]},
{t:"Fuentes comunes de ruido en el ambiente laboral",ico:"🏭",obj:["Identificar las principales fuentes de ruido en el trabajo.","Relacionar cada fuente con el tipo de ruido que suele generar.","Entender cómo los espacios cerrados y la suma de fuentes aumentan el nivel de ruido."],
b:[["1. Máquinas y equipos industriales","<p>Prensas, taladros y compresores generan ruido constante o variable. En una planta suelen funcionar muchas máquinas a la vez, y cada una suma al nivel general. Ejemplo: en una planta textil, las máquinas de tejer funcionan sin parar y crean un ruido constante y considerable.</p>"],
["2. Herramientas manuales","<p>Sierras eléctricas y taladros son fuentes importantes, sobre todo en espacios cerrados. Allí el sonido rebota en las superficies (reverberación) y la intensidad aumenta. Ejemplo: una sierra cortando madera o metal en un taller cerrado.</p>"],
["3. Procesos industriales","<p>La soldadura y el corte de metales combinan ruido constante y ruido de impacto, por el uso de herramientas de alta potencia y materiales duros. Ejemplo: una fábrica de metal donde se cortan y sueldan piezas.</p>"],
["4. Transporte interno","<p>Las carretillas elevadoras y las grúas suman ruido por el motor y por el movimiento de cargas pesadas, sobre todo donde trabajan toda la jornada. Las grúas aportan además ruido variable y de impacto.</p>"],
["5. Actividades humanas","<p>Conversaciones, instrucciones verbales y movimiento de personas pueden crear un ruido de fondo considerable. Ejemplos: un call center o una planta de ensamblaje con mucho personal, donde estos sonidos se suman a los de las herramientas y afectan a la concentración y la eficiencia.</p>"],
["Resumen de fuentes",'<div class="tbl"><table><tr><th>Fuente</th><th>Ejemplos</th><th>Tipo de ruido habitual</th></tr><tr><td>Máquinas y equipos</td><td>Prensas, compresores, telares</td><td>Estable o variable</td></tr><tr><td>Herramientas manuales</td><td>Sierras eléctricas, taladros</td><td>Variable, amplificado en espacios cerrados</td></tr><tr><td>Procesos industriales</td><td>Soldadura, corte de metales</td><td>Estable y de impacto</td></tr><tr><td>Transporte interno</td><td>Carretillas, grúas</td><td>Variable y de impacto</td></tr><tr><td>Actividades humanas</td><td>Conversaciones, movimiento</td><td>Ruido de fondo variable</td></tr></table></div>']],
key:"El nivel de ruido de un puesto rara vez viene de una sola fuente: es la suma de máquinas, herramientas, procesos, transporte y personas, y el espacio donde ocurre puede amplificarlo.",
q:[["¿Por qué una sierra eléctrica es más ruidosa en un taller cerrado?",["Porque consume más energía","Porque el sonido rebota y se amplifica (reverberación)","Porque corta más despacio"],1],
["La soldadura y el corte de metales suelen generar:",["Solo ruido estable","Ruido constante y de impacto","Solo ruido humano"],1],
["Las máquinas de tejer de una planta textil son un ejemplo de:",["Ruido constante de máquinas industriales","Ruido de impacto de herramientas manuales","Ruido de transporte interno"],0],
["Además del motor, ¿qué aporta ruido en el transporte interno?",["La iluminación de la nave","El movimiento de cargas pesadas","Las conversaciones del conductor"],1],
["En un call center, la principal fuente de ruido es:",["Los compresores","Las grúas","Las conversaciones y la actividad de las personas"],2]]},
{t:"Real Decreto 286/2006. Objetivos y ámbito de aplicación",ico:"⚖️",obj:["Explicar el objeto y el ámbito de aplicación del RD 286/2006.","Definir los parámetros con los que se mide el ruido.","Conocer los valores límite y de acción, y las obligaciones que activa cada uno.","Saber qué obligaciones tiene el empresario en prevención, protección, formación, consulta y vigilancia de la salud."],
b:[["Art. 1. Objeto","<p>Dentro de la Ley 31/1995 de Prevención de Riesgos Laborales, fija las disposiciones mínimas para proteger a los trabajadores frente al ruido, en especial frente a los daños auditivos, y también frente al estrés y la fatiga. El ruido debe mantenerse lo más bajo posible con los medios técnicos disponibles.</p>"],
["Art. 2. Definiciones (detalladas en el Anexo I)",'<ul><li><b>Nivel de presión acústica (Lp):</b> intensidad del sonido en un momento dado, en decibelios:<div class="formula" aria-label="L p igual a 10 por logaritmo en base 10 de P entre P cero, al cuadrado">L<sub>p</sub> = 10 · log<sub>10</sub> ( <span class="frac"><span>P</span><span>P<sub>0</sub></span></span> )<sup>2</sup></div>donde <i>P</i> es la presión acústica eficaz en pascales y <i>P<sub>0</sub></i> = 2·10<sup>−5</sup> Pa es la presión de referencia.</li><li><b>Nivel de pico (Lpico):</b> máxima presión acústica instantánea, en dB(C). Es clave con ruido de impacto, que puede dañar el oído al instante.</li><li><b>Nivel de exposición diaria equivalente (LAeq,d):</b> nivel continuo equivalente ponderado A para una jornada tipo de 8 horas. Resume toda la exposición del día, con sus fluctuaciones.</li><li><b>Nivel de exposición semanal equivalente (LAeq,s):</b> lo mismo calculado sobre la semana. Útil cuando el ruido cambia mucho de un día a otro.</li></ul>'],
["Art. 3. Ámbito de aplicación","<p>Todas las actividades en las que los trabajadores puedan estar expuestos a ruido por su trabajo: industria, construcción, agricultura, servicios, etc.</p>"],
["Art. 4. Evitar o reducir la exposición","<p>El ruido debe eliminarse en su origen o reducirse al mínimo posible. Medidas:</p><ul><li>Métodos de trabajo que exijan menos exposición.</li><li>Equipos de trabajo que hagan el menor ruido posible.</li><li>Diseño y distribución de lugares y puestos pensando en el ruido.</li><li>Información y formación sobre el uso correcto de los equipos.</li><li>Reducción técnica del ruido: del ruido aéreo (pantallas, cerramientos, materiales absorbentes) y del transmitido por sólidos (amortiguamiento, aislamiento).</li><li>Programas de mantenimiento adecuados.</li><li>Organización del trabajo: limitar duración e intensidad de la exposición y ordenar bien el tiempo de trabajo.</li></ul>"],
["Art. 5. Valores límite y valores de acción",'<div class="tbl"><table><tr><th>Valor</th><th>LAeq,d</th><th>Lpico</th></tr><tr><td>Valor límite de exposición</td><td>87 dB(A)</td><td>140 dB(C)</td></tr><tr><td>Valor superior de acción</td><td>85 dB(A)</td><td>137 dB(C)</td></tr><tr><td>Valor inferior de acción</td><td>80 dB(A)</td><td>135 dB(C)</td></tr></table></div><p>Para comprobar el valor límite <b>sí</b> se tiene en cuenta la atenuación de los protectores auditivos. Para los valores de acción <b>no</b>.</p>'],
["Art. 6. Evaluación de riesgos","<p>El empresario debe evaluar el riesgo midiendo el ruido, documentarlo y revisarlo periódicamente. Los métodos deben permitir obtener LAeq,d, Lpico y LAeq,s, y tener en cuenta las características del ruido, la duración de la exposición y los factores ambientales.</p>"],
["Art. 7. Protección individual","<p>Si el ruido no puede reducirse por otros medios, se entregan protectores auditivos adecuados y bien ajustados:</p><ul><li><b>A disposición</b> de los trabajadores a partir del valor inferior de acción (80 dB(A) / 135 dB(C)).</li><li><b>Uso obligatorio</b> a partir del valor superior de acción (85 dB(A) / 137 dB(C)).</li></ul><p>Deben elegirse para suprimir o reducir al mínimo el riesgo. La empresa fomenta su uso cuando no es obligatorio, vela por que se usen cuando lo es y comprueba su eficacia.</p>"],
["Art. 8. Limitación de la exposición","<p>Nunca se pueden superar los valores límite. Si ocurre, el empresario debe reducir la exposición de inmediato, averiguar la causa y corregir las medidas para que no se repita.</p>"],
["Art. 9. Información y formación","<p>Trabajadores y representantes deben recibir información y formación sobre los riesgos del ruido, las medidas de prevención y protección, el uso de los protectores, los resultados de las mediciones y las prácticas de trabajo seguras.</p>"],
["Art. 10. Consulta y participación","<p>Deben ser consultados y participar en la evaluación, en las medidas para reducir el ruido y en la elección de los protectores auditivos.</p>"],
["Art. 11. Vigilancia de la salud","<p>Si la evaluación indica riesgo, hay controles de la función auditiva:</p><ul><li>Al menos <b>cada 3 años</b> si se superan los valores superiores de acción.</li><li>Al menos <b>cada 5 años</b> si se superan los valores inferiores de acción.</li></ul>"]],
key:"80, 85 y 87 dB(A): a partir de 80 hay protectores disponibles y audiometría cada 5 años; a partir de 85 los protectores son obligatorios y la audiometría es cada 3 años; y 87, contando con el protector, no se puede superar nunca.",
q:[["¿Cuál es el valor límite de exposición diaria?",["80 dB(A)","85 dB(A)","87 dB(A)"],2],
["El nivel de pico se expresa en:",["dB(A)","dB(C)","Pascales"],1],
["¿Cuándo se tiene en cuenta la atenuación del protector auditivo?",["Al comprobar el valor límite","Al comprobar los valores de acción","Nunca"],0],
["¿A partir de qué nivel es obligatorio usar protectores auditivos?",["80 dB(A)","85 dB(A)","87 dB(A)"],1],
["Un cerramiento acústico alrededor de una máquina es una medida de:",["Protección individual","Reducción técnica del ruido aéreo","Vigilancia de la salud"],1],
["Si se superan los valores superiores de acción, la audiometría debe hacerse al menos:",["Cada año","Cada 3 años","Cada 5 años"],1],
["¿Qué parámetro conviene usar cuando el ruido varía mucho de un día a otro?",["Lpico","LAeq,d","LAeq,s"],2],
["Si se detecta una exposición por encima del valor límite, el empresario debe:",["Esperar a la siguiente evaluación","Reducirla de inmediato, buscar la causa y corregir las medidas","Entregar más tapones y nada más"],1]]},
{t:"Importancia de la Guía Técnica y de la NTP 270",ico:"📘",obj:["Explicar qué son las Guías Técnicas y las Notas Técnicas de Prevención (NTP), y quién las elabora.","Diferenciar entre lo que es obligatorio (la normativa) y lo que es orientativo (guías y NTP).","Entender por qué algunos documentos aparecen firmados por el INSHT y otros por el INSST."],
b:[["1. Quién las elabora: el INSST","<p>El Instituto Nacional de Seguridad y Salud en el Trabajo (INSST) es el organismo científico y técnico de la Administración General del Estado en materia de prevención, y depende del Ministerio de Trabajo y Economía Social. Antes se llamaba INSHT (Instituto Nacional de Seguridad e Higiene en el Trabajo).</p>"],
["2. Las Guías Técnicas",'<ul><li>Ayudan a interpretar los reglamentos que desarrollan la Ley de Prevención de Riesgos Laborales; por ejemplo, el RD 286/2006 sobre ruido.</li><li>Son <b>orientativas, no vinculantes</b>.</li><li>Se pueden consultar en la web del <a href="https://www.insst.es" target="_blank" rel="noopener">INSST</a>.</li></ul>'],
["3. Las Notas Técnicas de Prevención (NTP)","<ul><li>Es una colección que empezó en 1982 con la idea de servir de manual de consulta para todo prevencionista.</li><li>Ofrecen herramientas técnicas a profesionales de PRL y agentes sociales.</li><li><b>No son vinculantes ni de obligado cumplimiento.</b></li></ul>"],
["4. ¿Qué es obligatorio entonces?",'<p>La empresa debe cumplir la normativa que le aplique en cada momento, ya sea estatal, autonómica o local. Las Guías Técnicas y las NTP no añaden obligaciones: ayudan a cumplirlas, porque explican cómo aplicar técnicamente lo que exige la ley.</p><div class="tbl"><table><tr><th></th><th>Normativa (p. ej. RD 286/2006)</th><th>Guía Técnica</th><th>NTP</th></tr><tr><td>¿Quién la hace?</td><td>Legislador / Gobierno</td><td>INSST</td><td>INSST</td></tr><tr><td>¿Obligatoria?</td><td>Sí</td><td>No, orientativa</td><td>No, orientativa</td></tr><tr><td>¿Para qué sirve?</td><td>Fija obligaciones</td><td>Interpretar el reglamento</td><td>Apoyo técnico al prevencionista</td></tr></table></div>'],
["5. INSHT o INSST","<p>Los dos nombres corresponden al mismo organismo. Por eso la NTP 270, que es más antigua, aparece elaborada por el INSHT, y la nueva Guía Técnica para la evaluación del ruido ya va firmada por el INSST.</p>"]],
key:"La ley dice qué hay que cumplir; la Guía Técnica y la NTP 270 explican cómo hacerlo bien.",
q:[["¿Quién elabora las Guías Técnicas y las NTP?",["La Inspección de Trabajo","El INSST","Las mutuas"],1],
["Las Guías Técnicas son:",["De obligado cumplimiento","Orientativas y no vinculantes","Obligatorias solo en la industria"],1],
["La colección de NTP se inició en:",["1982","1995","2006"],0],
["¿Por qué la NTP 270 aparece firmada por el INSHT?",["Porque es de otro organismo distinto","Porque es anterior al cambio de nombre a INSST","Porque es una norma europea"],1],
["Si una NTP y un real decreto aplicable dicen cosas distintas, la empresa debe cumplir:",["La NTP","El real decreto","La que prefiera"],1]]}];

Object.assign({ico:"📏"},{"t": "Determinación de la exposición al ruido en el trabajo (método de ingeniería)", "obj": ["Explicar para qué sirve la norma UNE-EN ISO 9612.", "Nombrar las tres estrategias de medición que propone.", "Entender que el resultado de una medición es un intervalo con una incertidumbre, no un número exacto."], "key": "Medir el ruido no consiste en \"poner el sonómetro y leer\": hay que elegir la estrategia adecuada y tener en cuenta la incertidumbre del resultado.", "q": [["¿Qué norma describe el método de ingeniería para medir la exposición al ruido?", ["UNE-EN ISO 9612", "UNE-EN ISO 9001", "RD 286/2006"], 0], ["¿En qué parámetro se centra principalmente la norma?", ["Lpico", "LAeq,d y su incertidumbre", "La frecuencia del ruido"], 1], ["¿Cuál de estas NO es una de las estrategias de medición de la norma?", ["Basada en la tarea", "Basada en la jornada completa", "Basada en el número de máquinas"], 2], ["El resultado de aplicar una estrategia de medición es:", ["Un valor exacto del LAeq,d", "Un intervalo donde está, con cierta probabilidad, el valor verdadero", "Una lista de las fuentes de ruido"], 1]]},{b:[["1. La norma UNE-EN ISO 9612","<p>Su título es \"Determinación de la exposición al ruido en el trabajo. Método de ingeniería\". Explica cómo medir la exposición al ruido en un entorno laboral y cómo calcular los niveles correspondientes. Se centra sobre todo en:</p><ul><li>El <b>nivel diario equivalente (LAeq,d)</b>.</li><li>La <b>incertidumbre</b> de ese valor.</li></ul>"],["2. Medir bien importa","<p>La forma en que se hacen las mediciones determina lo fiables que son los resultados. Una mala estrategia puede dar un valor que no refleja la exposición real del trabajador.</p>"],["3. Las tres estrategias de medición","<ul><li><b>Basada en la tarea:</b> se mide el ruido de cada tarea que hace el trabajador.</li><li><b>Basada en el puesto de trabajo:</b> se toman muestras del ruido del puesto a lo largo de la jornada.</li><li><b>Basada en la jornada completa:</b> se mide de forma continua durante toda la jornada.</li></ul>"],["4. El resultado: un intervalo","<p>Aplicar cualquiera de estas estrategias no da un único número, sino un <b>intervalo de valores</b> en el que, con una cierta probabilidad, está el valor verdadero del LAeq,d.</p>"]]}),
Object.assign({ico:"📐"},{"t": "Estrategia de medición basada en la tarea", "obj": ["Saber cuándo es adecuada la estrategia basada en la tarea.", "Conocer cómo se determina la duración de cada tarea.", "Aplicar las reglas de duración y número de muestras de la norma."], "key": "Tres muestras por tarea, mínimo 5 minutos cada una salvo excepciones, y si difieren 3 dB o más, hay que medir más o replantear la tarea.", "q": [["¿Cuándo es adecuada la estrategia basada en la tarea?", ["Siempre que haya ruido", "Cuando la jornada se divide en tareas de duración conocida y con nivel de ruido repetible", "Solo cuando el ruido es de impacto"], 1], ["Duración mínima general de cada medición:", ["1 minuto", "5 minutos", "15 minutos"], 1], ["Con ruido estable, la medición puede durar:", ["Menos de 5 minutos, pero nunca menos de 1", "Cualquier tiempo, incluso segundos", "Siempre 8 horas"], 0], ["Una tarea cíclica tiene ciclos de 1,5 minutos. ¿Cuántos ciclos hay que medir?", ["3 ciclos (4,5 min)", "4 ciclos (6 min)", "2 ciclos (3 min)"], 1], ["¿Cuántas muestras mínimas se necesitan por tarea?", ["1", "2", "3"], 2], ["Si las tres muestras difieren 3 dB o más, ¿qué NO es una opción válida?", ["Hacer al menos tres mediciones más", "Quedarse con la medición más baja", "Subdividir la tarea y repetir"], 1]]},{b:[["1. ¿Cuándo usarla?","<p>Solo cuando se cumplen <b>a la vez</b> dos condiciones:</p><ul><li>La jornada se puede dividir en tareas de duración conocida.</li><li>Cada tarea tiene un contenido parecido y un nivel continuo equivalente repetible, y por tanto representativo de ella.</li></ul>"],["2. Duración de la tarea","<ul><li>Se determina contrastando lo que dicen la plantilla y la empresa, o a partir de la actividad de las fuentes de ruido durante la tarea.</li><li>Opcionalmente, se mide la duración varias veces (por ejemplo, tres) y se toma la media aritmética.</li><li>La exactitud de esa duración es especialmente importante cuando las fuentes de ruido son muy intensas.</li><li>Si hay ruidos que no son propios de la tarea, hay que tener en cuenta cómo influyen en el muestreo.</li></ul>"],["3. ¿Cuánto debe durar cada medición?","<p>Depende de la duración de la tarea y de cómo varía su ruido. Se cumplen dos reglas:</p><p><i>Regla 1, para cualquier tipo de ruido:</i> al menos <b>5 minutos</b>, con dos excepciones:</p><ul><li>Si la tarea dura menos de 5 minutos, se mide la tarea entera.</li><li>Si el ruido es estable, puede medirse menos de 5 minutos, pero <b>nunca menos de 1 minuto</b>.</li></ul><p><i>Regla 2, según el tipo de ruido:</i></p><ul><li><b>Cíclico:</b> un número entero de ciclos, mínimo <b>tres</b>.</li><li><b>Fluctuante:</b> el tiempo suficiente para que el resultado sea representativo de la tarea.</li></ul><p><b>Ejemplo.</b> Una tarea cíclica dura 1,5 minutos por ciclo. Tres ciclos suman 4,5 minutos y no llegan a los 5 minutos mínimos. Hay que medir <b>cuatro ciclos completos, 6 minutos</b>.</p>"],["4. ¿Cuántas muestras?","<p>Como mínimo <b>tres por tarea</b>. Si entre las tres hay una diferencia de <b>3 dB o más</b>, se elige una de estas opciones:</p><ul><li>Hacer al menos tres mediciones más de la tarea.</li><li>Repetir las mediciones con más duración cada una.</li><li>Dividir la tarea en subtareas y repetir el proceso.</li></ul><div class=\"tbl\"><table><tr><th>Situación</th><th>Duración de cada medición</th></tr><tr><td>Caso general</td><td>Mínimo 5 min</td></tr><tr><td>Tarea de menos de 5 min</td><td>Toda la tarea</td></tr><tr><td>Ruido estable</td><td>Puede ser menos de 5 min, nunca menos de 1 min</td></tr><tr><td>Ruido cíclico</td><td>Ciclos enteros, mínimo 3, y cumpliendo los 5 min</td></tr><tr><td>Ruido fluctuante</td><td>Lo necesario para que sea representativa</td></tr></table></div>"]]}),
Object.assign({ico:"👷"},{"t": "Estrategia de medición basada en el puesto de trabajo", "obj": ["Saber cuándo conviene esta estrategia y cuándo no.", "Calcular la duración mínima acumulada de las mediciones según el tamaño del grupo.", "Calcular cuánto dura cada muestra y qué hacer si la incertidumbre es alta."], "key": "Mínimo 5 muestras al azar en el grupo, una duración total que crece con el tamaño del grupo, y la incertidumbre por debajo de 3,5 dB.", "q": [["¿Cuándo es especialmente útil esta estrategia?", ["Cuando las tareas son difíciles de describir o no es práctico analizarlas", "Cuando el puesto tiene pocas tareas muy ruidosas", "Solo con ruido de impacto"], 0], ["¿Cuántas muestras mínimas hay que tomar?", ["3", "5", "10"], 1], ["¿Cómo se reparten las muestras?", ["Todas al mismo trabajador", "Al azar entre todo el GHE", "Solo a los trabajadores más expuestos"], 1], ["Duración mínima acumulada para un GHE de 4 personas:", ["2 horas", "5 horas", "8 horas"], 1], ["Un GHE de 25 personas necesita como mínimo:", ["10 horas", "12,5 horas", "17 horas"], 1], ["Si se planifican 5 muestras y la duración acumulada es de 10 horas, cada muestra dura:", ["1 hora", "2 horas", "5 horas"], 1], ["Si la incertidumbre supera 3,5 dB, ¿qué NO es una opción válida?", ["Aumentar el número de mediciones", "Pasar a la estrategia de jornada completa", "Descartar las mediciones más altas"], 2]]},{b:[["1. ¿Cuándo usarla?","<ul><li>Cuando el trabajo y sus tareas típicas son difíciles de describir.</li><li>Cuando no se quiere hacer, o no es práctico, un análisis detallado del trabajo.</li><li><b>No se recomienda</b> si el puesto tiene pocas tareas y son muy ruidosas.</li></ul>"],["2. El grupo homogéneo de exposición (GHE)","<p>Es el grupo de trabajadores que hacen un trabajo parecido y tienen una exposición al ruido similar. Las mediciones se reparten entre sus integrantes.</p>"],["3. El plan de medición","<ul><li>Debe recoger los episodios cortos de ruido intenso.</li><li>Debe recoger cómo varía el ruido a lo largo de la jornada y en los distintos lugares.</li><li>Depende también de los equipos y de las personas disponibles para observar y controlar el muestreo.</li><li>Siempre <b>5 muestras o más</b>, repartidas al azar entre todo el GHE.</li></ul>"],["4. Duración mínima acumulada (Tabla 1)","<div class=\"tbl\"><table><tr><th>Personas en el GHE (G)</th><th>Duración mínima acumulada</th></tr><tr><td>G ≤ 5</td><td>5 horas</td></tr><tr><td>5 &lt; G ≤ 15</td><td>5 + (G − 5) / 2 horas</td></tr><tr><td>15 &lt; G ≤ 40</td><td>10 + (G − 15) / 4 horas</td></tr><tr><td>G &gt; 40</td><td>17 horas, o dividir el grupo</td></tr></table></div>"+img("01M5EBZ07Y47GCZTMMRN3MHDQM","Tabla 1. Duración mínima acumulada")],["5. Duración de cada muestra","<p>Se divide la duración acumulada entre el número de muestras previstas, para que todas duren lo mismo.</p><p><b>Ejemplo.</b> Un GHE de 10 personas necesita 5 + (10 − 5) / 2 = <b>7,5 horas</b> acumuladas. Con 5 muestras, cada una dura 7,5 / 5 = <b>1,5 horas</b>.</p>"],["6. Si la incertidumbre es alta","<p>Si la incertidumbre del muestreo supera <b>3,5 dB</b>, hay que reducirla de una de estas formas:</p><ul><li>Haciendo más mediciones.</li><li>Modificando el GHE.</li><li>Pasando a la estrategia de jornada completa.</li></ul>"]]}),
Object.assign({ico:"\ud83d\udcca"},{"t": "Estrategia de medición basada en la jornada completa", "obj": ["Saber cuándo se aplica la estrategia de jornada completa.", "Explicar por qué se usan dosímetros personales y qué riesgos tienen.", "Conocer cuántas jornadas hay que medir."], "key": "La jornada completa es la estrategia comodín: vale para todo, pero exige vigilar que el dosímetro no registre ruidos ajenos al trabajo.", "q": [["¿Cuándo se suele recurrir a la estrategia de jornada completa?", ["Siempre, es obligatoria", "Cuando las otras estrategias no son aplicables", "Solo con ruido estable"], 1], ["¿Qué equipo es más práctico para esta estrategia?", ["Sonómetro fijo", "Dosímetro personal", "Calibrador acústico"], 1], ["Si no se puede medir la jornada entera:", ["Se anula la evaluación", "Se documentan los motivos y se cubre lo máximo posible, incluyendo los periodos más ruidosos", "Se mide solo la primera hora"], 1], ["¿Cuál es un ejemplo de contribución falsa al medir con dosímetro?", ["El ruido de la máquina del puesto", "Música o golpes al propio dosímetro", "El ruido de una herramienta de la tarea"], 1], ["¿Qué ayuda a detectar contribuciones falsas?", ["Dosímetros con historial de exposición o grabación de audio", "Medir solo los fines de semana", "Quitar el dosímetro en los ratos ruidosos"], 0], ["Se miden tres jornadas y difieren 4 dB. ¿Qué hay que hacer?", ["Nada, se toma la media", "Medir dos jornadas más", "Repetir las tres jornadas"], 1]]},{b:[["1. ¿Cuándo usarla?", "<p>Sirve para cualquier tipo de exposición, pero lo habitual es recurrir a ella cuando las estrategias basadas en la tarea o en el puesto no se pueden aplicar.</p>"],["2. El equipo: dosímetros personales", "<p>Las mediciones son largas e incluyen los ratos ruidosos y los tranquilos, así que lo más práctico es usar <b>dosímetros personales</b>, que lleva puestos el propio trabajador.</p>"],["3. Qué días medir", "<ul><li>Días <b>representativos</b> del trabajo habitual.</li><li>Si no se puede medir la jornada entera, hay que documentar por qué y cubrir todo lo posible, incluyendo los periodos más ruidosos.</li></ul>"],["4. Cuidado con las contribuciones falsas", "<p>Al medir tanto tiempo con el dosímetro puesto, es más fácil que se cuelen ruidos que no tienen que ver con el trabajo: golpes al aparato, música, voces… Para minimizarlo:</p><ul><li>Observar directamente el trabajo para comprobar que el muestreo es representativo.</li><li>Hacer mediciones previas de tanteo con un sonómetro.</li><li>Preguntar a la plantilla qué actividades han hecho.</li><li>Usar dosímetros que guarden el historial de la exposición, como la evolución del nivel en el tiempo o una grabación de audio.</li></ul>"],["5. ¿Cuántas jornadas?", "<ul><li>Primero, <b>tres jornadas completas</b>.</li><li>Si los resultados difieren <b>3 dB o más</b>, se miden <b>dos jornadas más</b>.</li></ul><div class=\"tbl\"><table><tr><th>Estrategia</th><th>Muestras mínimas</th><th>Si hay mucha diferencia</th></tr><tr><td>Tarea</td><td>3 por tarea</td><td>3 dB o más: más mediciones, más largas o subdividir la tarea</td></tr><tr><td>Puesto</td><td>5 al azar en el GHE</td><td>Incertidumbre mayor de 3,5 dB: más mediciones, cambiar el GHE o pasar a jornada completa</td></tr><tr><td>Jornada completa</td><td>3 jornadas</td><td>3 dB o más: 2 jornadas más</td></tr></table></div>"]]}),
Object.assign({ico:"\ud83e\uddee"},{"t": "Calculando la incertidumbre", "obj": ["Identificar de dónde viene la incertidumbre de una medición de ruido.", "Saber que la herramienta del INSST calcula la incertidumbre según la estrategia elegida y el equipo de medición."], "key": "Toda medición tiene incertidumbre, y no es solo cosa del aparato: el trabajo, el micrófono, los ruidos ajenos y un mal análisis previo también cuentan.", "q": [["¿Qué tiene en cuenta la herramienta del INSST para calcular la incertidumbre?", ["Solo el nivel de pico", "La estrategia elegida y el equipo de medición", "El número de máquinas de la empresa"], 1], ["¿Cuál de estas es una fuente de incertidumbre?", ["La posición del micrófono", "El color del sonómetro", "El convenio colectivo"], 0], ["Una señal de alarma que suena durante la medición es:", ["Una contribución singular", "Un error de calibración", "Ruido estable de la tarea"], 0], ["Un golpe al micrófono se considera:", ["Ruido de impacto del puesto", "Una contribución falsa", "Una variación normal del trabajo"], 1], ["Si la calculadora del INSST no funciona en Chrome, se recomienda:", ["Usar Firefox", "Hacer los cálculos a mano", "Usar otra herramienta no oficial"], 0]]},{b:[["1. ¿Para qué sirve la herramienta del INSST?", "<p>Ayuda a hacer los cálculos de los informes de ruido. En concreto, calcula la incertidumbre teniendo en cuenta la estrategia de medición elegida (tarea, puesto o jornada completa) y el equipo que se ha usado.</p>"],["2. ¿De dónde sale la incertidumbre?", "<ul><li>Las variaciones del trabajo de un día a otro.</li><li>El tipo de instrumento y su calibración.</li><li>La posición del micrófono.</li><li>Contribuciones falsas: corrientes de aire, golpes al micrófono, etc.</li><li>Contribuciones singulares: voces, música, señales de alarma, etc.</li><li>Errores en el análisis previo de las condiciones de trabajo.</li></ul>"],["3. Acceso a la calculadora", "<a class=\"btn linkbtn\" href=\"https://herramientasprl.insst.es/higiene/evaluacion-de-la-exposicion-al-ruido\" target=\"_blank\" rel=\"noopener\">🧮 Calculadora de evaluación de la exposición al ruido del INSST ↗</a><div class=\"card key\"><p>⚠️ <b>Importante:</b> puede no funcionar bien en algunos navegadores. Si no carga o falla en Chrome, ábrela con Firefox.</p></div>"]]}),
Object.assign({ico:"\ud83c\udf9b\ufe0f"},{"t": "Instrumentos de medición", "obj": ["Conocer los instrumentos válidos para medir ruido y la clase mínima exigida.", "Describir las partes básicas de un instrumento de medición acústica.", "Saber cuándo usar cada instrumento y cómo se controla su calibración."], "key": "Mínimo clase 2, el instrumento adecuado para cada fin, y calibración antes y después de medir: si se desvía más de 0,5 dB, las mediciones no valen.", "q": [["¿Qué clase mínima deben tener los instrumentos de medición?", ["Clase 0", "Clase 1", "Clase 2"], 2], ["¿Qué parte del instrumento convierte la onda sonora en señal eléctrica?", ["El micrófono (transductor)", "El filtro de ponderación", "La pantalla"], 0], ["¿Qué instrumento es el más adecuado para medir la exposición personal de un trabajador?", ["Sonómetro convencional", "Dosímetro", "Calibrador"], 1], ["Un sonómetro de clase 1 tiene una precisión aproximada de:", ["±1 dB", "±2 dB", "±5 dB"], 0], ["¿Quién se encarga de la verificación tras una reparación?", ["El fabricante", "El titular del equipo", "La Inspección de Trabajo"], 1], ["¿Cuándo hay que comprobar el instrumento con el calibrador?", ["Una vez al año", "Antes y después de cada medición o serie de mediciones", "Solo si da valores raros"], 1], ["En la comprobación final, el equipo se ha desviado 0,8 dB. ¿Qué se hace?", ["Se corrige el resultado sumando 0,8 dB", "Se desechan las mediciones y se envía el equipo a reparar y verificar", "Se da por buena la medición"], 1]]},{b:[["Diapositivas",CAR]].concat([["1. Instrumentos permitidos", "<p>Sonómetros, sonómetros integradores promediadores y dosímetros, como mínimo de <b>clase 2</b>, en las condiciones del Anexo III del RD 286/2006.</p>"],["2. Partes de un instrumento de medición", "<ul><li><b>Transductor (micrófono):</b> convierte en señal eléctrica las variaciones de presión que produce la onda sonora.</li><li><b>Procesamiento de la señal:</b> adapta la respuesta a cómo oye el ser humano. Puede incluir amplificadores, filtros de ponderación e integración de la señal durante un tiempo. Algunos equipos permiten elegir ese tiempo según el tipo de ruido.</li><li><b>Visualización, registro y almacenamiento</b> de los resultados.</li></ul>"],["3. Tipos de instrumentos", "<div class=\"tbl\"><table><tr><th>Instrumento</th><th>Qué mide</th><th>Para qué se usa</th></tr><tr><td>Sonómetro convencional</td><td>Nivel de presión sonora instantáneo en dB, en tiempo real</td><td>Tantear el ambiente sonoro y ahorrar tiempo, dejando los equipos de gama superior para medidas precisas o informes</td></tr><tr><td>Sonómetro integrador promediador</td><td>Nivel continuo equivalente (Leq); además, percentiles y algunos análisis en frecuencia</td><td>Mediciones más completas; puede pasar los datos al ordenador</td></tr><tr><td>Dosímetro</td><td>LAeq y LCpico, y calcula el nivel de exposición diario (LEP,d)</td><td>Medir la exposición personal y directa de un trabajador</td></tr></table></div>"],["4. Clases de precisión", "<ul><li><b>Clase 1:</b> precisión aproximada de ±1 dB.</li><li><b>Clase 2:</b> precisión aproximada de ±2 dB.</li></ul>"],["5. Combinar instrumentos", "<p>Aunque se mida con dosímetros, conviene tomar con un sonómetro integrador referencias del ruido de las distintas fuentes. Así se comprueba que los resultados son coherentes.</p>"],["6. Control metrológico", "<p>Los instrumentos deben pasar control metrológico en tres momentos:</p><div class=\"tbl\"><table><tr><th>Momento</th><th>Tipo de control</th><th>Responsable</th></tr><tr><td>Comercialización</td><td>Conformidad</td><td>Fabricante</td></tr><tr><td>Reparación</td><td>Verificación</td><td>Titular del equipo</td></tr><tr><td>Mantenimiento periódico</td><td>Verificación</td><td>Titular del equipo</td></tr></table></div>"],["7. Comprobación in situ con el calibrador", "<p>El artículo 6 del RD 286/2006 obliga a comprobar el instrumento con un calibrador acústico <b>antes y después</b> de cada medición o serie de mediciones. Si la desviación supera lo que admite el fabricante (en general, más de <b>0,5 dB</b>), hay que <b>desechar las mediciones</b> y enviar el equipo a reparar y verificar.</p>"]])}),
Object.assign({ico:"\u2705"},{"t": "Conclusiones", "obj": [], "key": "Primero se mira cómo son las tareas para elegir la estrategia, se valora el esfuerzo que exige cada una y después se escoge el instrumento que encaja con esa estrategia y con el tipo de ruido.", "q": [["Si las tareas tienen una duración no definida, ¿qué estrategias se pueden usar?", ["Solo la de la tarea", "La del puesto de trabajo o la de jornada completa", "Ninguna"], 1], ["¿Qué estrategia exige más esfuerzo de medición?", ["La tarea", "El puesto de trabajo", "La jornada completa"], 2], ["¿Qué estrategia exige más esfuerzo de análisis del trabajo?", ["La tarea", "El puesto de trabajo", "La jornada completa"], 0], ["¿Qué instrumento sirve para todas las estrategias?", ["Dosímetro", "Sonómetro convencional", "Sonómetro integrador promediador"], 0], ["Un sonómetro convencional solo puede usarse con:", ["Ruido de impacto", "Ruido estable y estrategia basada en la tarea", "Cualquier ruido y cualquier estrategia"], 1]]},{b:[["Tabla 5. Selección de la estrategia de medición",img("01M5ECBW9YARD0J7ZD6XY8P6A4","Tabla 5")+"<p>Sirve para elegir la estrategia según cómo sean las tareas:</p><ul><li>Si las tareas tienen <b>duración conocida y un nivel de ruido característico</b>, valen las tres estrategias: tarea, puesto o jornada completa.</li><li>Si las tareas son <b>difíciles de describir</b>, tienen <b>duración no definida</b> o su nivel de ruido <b>no es característico</b>, la estrategia basada en la tarea no sirve. Hay que usar la del puesto de trabajo o la de jornada completa.</li></ul>"],["Tabla 6. Exigencias de cada estrategia",img("01M5ECC5AXSQQBEZFDHFB2SJMW","Tabla 6")+"<p>Cada estrategia reparte el esfuerzo de forma distinta entre analizar el trabajo y medir:</p><ul><li><b>Tarea:</b> mucho análisis previo del trabajo (alto), pero poca medición (bajo).</li><li><b>Puesto de trabajo:</b> análisis medio y medición alta.</li><li><b>Jornada completa:</b> poco análisis (bajo), pero muchísima medición (muy alto).</li></ul><p>Cuanto mejor conoces el trabajo, menos tienes que medir, y al revés.</p>"],["Tabla 7. Selección del tipo de instrumento",img("01M5ECCGSAX08TPWG8YG6F338Z","Tabla 7")+"<ul><li><b>Dosímetro:</b> sirve para todo tipo de ruido y para todas las estrategias. Norma mínima UNE EN 61252 (y sus modificaciones A1 y A2). Mide hasta 4000 Hz, o sin límite de frecuencia si cumple la UNE EN 61672.</li><li><b>Sonómetro integrador promediador:</b> todo tipo de ruido, pero solo en la estrategia basada en la tarea. Norma UNE EN 61672-1, sin límite de frecuencia.</li><li><b>Sonómetro convencional:</b> solo para ruido estable y en la estrategia basada en la tarea. Norma UNE EN 61672-1, sin límite de frecuencia.</li></ul>"]]}),
Object.assign({ico:"🦻"},{"t": "Protecciones auditivas y control del riesgo", "obj": ["Elegir el tipo de protector auditivo adecuado según el entorno de trabajo.", "Distinguir los métodos SNR, HML y bandas de octava para valorar la atenuación.", "Aplicar las pautas básicas de uso y mantenimiento.", "Explicar en qué consiste un programa de conservación auditiva y cómo se comprueba que funciona."], "key": "Proteger el oído es un sistema completo: el protector adecuado, bien usado y mantenido, dentro de un programa con formación, mediciones y audiometrías que demuestren que funciona.", "q": [["¿Qué factor NO es clave al elegir un protector auditivo?", ["El nivel de ruido", "La compatibilidad con casco o gafas", "El color del protector"], 2], ["¿Para qué entorno son ideales los tapones?", ["Ruido constante de nivel moderado", "Ruido muy alto e intermitente", "Solo ruido de impacto"], 0], ["¿Por qué las orejeras son prácticas en trabajos intermitentes?", ["Porque son desechables", "Porque son fáciles de poner y quitar", "Porque no necesitan ajuste"], 1], ["¿Qué método de atenuación es el más preciso?", ["SNR", "HML", "Bandas de octava"], 2], ["El método HML da la atenuación en:", ["Un único valor global", "Frecuencias altas, medias y bajas", "Cada banda de octava"], 1], ["¿Por qué hay que cambiar los tapones desechables con regularidad?", ["Porque pierden eficacia con el uso y la suciedad", "Porque cambia la normativa", "Porque se quedan pequeños"], 0], ["¿Qué incluye un programa de conservación auditiva?", ["Solo repartir protectores", "Evaluación del ruido, formación continua y vigilancia de la salud auditiva", "Solo audiometrías al entrar en la empresa"], 1], ["¿Para qué sirven los exámenes audiométricos dentro del programa?", ["Para detectar pronto la pérdida de audición y valorar si el programa funciona", "Para medir el ruido de las máquinas", "Para elegir el color de los protectores"], 0]]},{b:[["1. Elegir bien el protector", "<p>No vale cualquier protector. Hay que tener en cuenta:</p><ul><li>El nivel de ruido al que se está expuesto.</li><li>La comodidad.</li><li>La compatibilidad con otros EPI, como cascos o gafas de seguridad.</li></ul>"], ["2. Tipos de protectores", "<div class=\"tbl\"><table><tr><th></th><th>Tapones</th><th>Orejeras</th></tr><tr><td>Cómo son</td><td>Pequeños, se insertan en el canal auditivo</td><td>Cubren toda la oreja</td></tr><tr><td>Ideales para</td><td>Ruido constante de nivel moderado</td><td>Ruido muy alto o cuando hace falta protección extra</td></tr><tr><td>Ventajas</td><td>Portátiles y cómodos durante mucho tiempo</td><td>Fáciles de poner y quitar; prácticos en trabajos intermitentes</td></tr></table></div><p>Además de cuánto reducen el ruido, cuentan la comodidad y el tiempo de uso: <b>si un protector no es cómodo, es menos probable que se use bien</b>.</p>"], ["3. Métodos para elegir la atenuación", "<ul><li><b>SNR (Single Number Rating):</b> un único valor de reducción global del ruido. Es fácil para comparar protectores, pero no siempre es suficiente.</li><li><b>HML:</b> da la atenuación en tres rangos de frecuencia: alta (H), media (M) y baja (L). Útil cuando el ruido del puesto cambia mucho según la frecuencia.</li><li><b>Bandas de octava:</b> da la atenuación en cada banda de octava. Es el método más preciso, ideal para ruidos complejos y variados.</li></ul><div class=\"tbl\"><table><tr><th>Método</th><th>Detalle</th><th>Cuándo usarlo</th></tr><tr><td>SNR</td><td>Bajo (un solo valor)</td><td>Comparaciones rápidas</td></tr><tr><td>HML</td><td>Medio (3 rangos)</td><td>Ruido con frecuencias muy distintas</td></tr><tr><td>Bandas de octava</td><td>Alto (banda a banda)</td><td>Ruido complejo y variado</td></tr></table></div>"], ["4. Uso correcto", "<p>Hay que seguir las instrucciones del fabricante:</p><ul><li><b>Tapones:</b> bien insertados en el canal auditivo; mal colocados no bloquean el ruido.</li><li><b>Orejeras:</b> bien ajustadas alrededor de la oreja, sin huecos por donde entre el ruido.</li></ul>"], ["5. Mantenimiento", "<ul><li><b>Tapones desechables:</b> se cambian con regularidad, porque pierden eficacia con el uso y la suciedad.</li><li><b>Orejeras:</b> se limpian según el fabricante y se revisan almohadillas y sellos periódicamente.</li></ul><p>Un buen mantenimiento alarga la vida del protector y mantiene su nivel de protección.</p>"], ["6. Programas de conservación auditiva", "<p>Son esenciales donde el ruido es un problema. No consisten solo en repartir protectores, sino que incluyen:</p><ul><li>Evaluación periódica de los niveles de ruido.</li><li>Formación continua de los trabajadores.</li><li>Vigilancia de la salud auditiva.</li></ul>"], ["7. Formación y sensibilización", "<p>Los trabajadores deben entender los riesgos del ruido y cómo protegerse: colocación y uso correctos de los protectores, mantenimiento y consecuencias de no protegerse. Además de la formación inicial, conviene hacer <b>sesiones de actualización</b> periódicas para reforzar el mensaje e informar de cambios en procedimientos o niveles de ruido.</p>"], ["8. Comprobar que el programa funciona", "<p>Un programa no se pone en marcha y se olvida. Hay que revisar de forma continua:</p><ul><li>Los niveles de ruido.</li><li>El uso real de los protectores.</li><li>La salud auditiva de los trabajadores.</li></ul><p>Los <b>exámenes audiométricos</b> detectan pérdidas de audición en fase temprana, ayudan a evitar daños permanentes e indican si los protectores funcionan o si hay que ajustar el programa.</p>"]]})];

function home(){main.innerHTML=`<div>`+heroX()+`<div class="sech">Contenido del curso por lecciones</div>`+MODS.map((M,m)=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><span class="tag">Módulo ${m+1}</span><h3 style="margin:.3em 0">${M.t.replace(/^Módulo \d: /,"")}</h3><p style="color:var(--mut);margin:0">${M.s}</p></div><button class="btn st" data-m="${m}">${modPct(m)?"Continuar ▶":"Empezar ▶"}</button></div><div class="prog" style="max-width:none;margin:12px 0;display:block"><i style="width:${modPct(m)}%"></i></div><div class="grid">${M.L.map((l,i)=>`<div class="card lc" data-v="${m}-${i}"><div style="font-size:1.8rem">${l.ico}</div><span class="tag">Lección ${i+1}</span><h4>${l.t}</h4><p style="color:var(--mut)">${l.q.length?l.q.length+" preguntas · "+(st.scores[m+"-"+i]!=null?"Nota: "+st.scores[m+"-"+i]+"/"+l.q.length:"Pendiente"):(st.done[m+"-"+i]?"Leída":"Pendiente")}</p></div>`).join("")}<div class="card lc" data-v="${m}-final"><div style="font-size:1.8rem">🏁</div><span class="tag">Evaluación</span><h4>Test final del módulo</h4><p style="color:var(--mut)">10 preguntas al azar</p></div></div></div>`).join("")+homeM3()+`</div>`;

function quizHTML(qs,id){return qs.map((q,k)=>`<div class="q" data-k="${k}"><p>${k+1}. ${q[0]}</p>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${"abcd"[j]}) ${o}</button>`).join("")}<div class="fb"></div></div>`).join("")+`<div class="score" id="sc-${id}"></div>`;}

if(j===q[2]){ok++;fb.textContent="✔ ¡Correcto!";fb.style.color="var(--ok)"}else{b.classList.add("ko");fb.textContent="✘ Incorrecto. La respuesta correcta es: "+q[1][q[2]];fb.style.color="var(--ko)"}
if(++ans===qs.length){const s=$("#sc-"+id);s.innerHTML=`Puntuación: ${ok}/${qs.length} ${ok/qs.length>=.7?"🎉 ¡Superado!":"🔁 Repasa y vuelve a intentarlo."} <button id="retry-${id}">Repetir</button>`;$("#retry-"+id).onclick=()=>go(parse(st.last));onDone(ok)}})});}
function lesson(m,i){const LL=MODS[m].L,l=LL[i],k=m+"-"+i;main.innerHTML=`<div><span class="tag">Módulo ${m+1} · Lección ${i+1} de ${LL.length}</span><h2>${l.ico} ${l.t}</h2>
${l.obj.length?`<div class="card"><b>🎯 Objetivos.</b> Al terminar la lección, el alumno podrá:<ul>${l.obj.map(o=>`<li>${o}</li>`).join("")}</ul></div>`:""}
${l.b.map((b,j)=>`<details ${j<2||/linkbtn|<figure/.test(b[1])?"open":""}><summary>${b[0]}</summary><div>${b[1]}</div></details>`).join("")}
${l.key?`<div class="card key"><b>💡 Idea clave.</b> ${l.key}</div>`:""}
<div class="card">${l.q.length?`<h3>📝 Autoevaluación</h3>${quizHTML(l.q,"q"+k)}`:`<button class="btn" id="read">${st.done[k]?"✅ Leída":"Marcar como leída"}</button>`}</div>
<div class="pn"><button id="prev">◀ ${i?"Lección "+i:"Portada"}</button><button class="btn" id="next">${i<LL.length-1?"Lección "+(i+2):"Test final"} ▶</button></div></div>`;
const fin=ok=>{if(ok!=null)st.scores[k]=ok;st.done[k]=1;save();renderNav({m,p:i});progress(m)};

function finalTest(m){const pool=[];MODS[m].L.forEach(l=>l.q.forEach(q=>pool.push(q)));
for(let k=pool.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[pool[k],pool[r]]=[pool[r],pool[k]]}
const n=Math.min(10,pool.length),need=Math.ceil(n*.7),k=m+"-final";
const qs=pool.slice(0,n).map(q=>{const o=q[1].map((t,j)=>({t,c:j===q[2]})).sort(()=>Math.random()-.5);return[q[0],o.map(x=>x.t),o.findIndex(x=>x.c)]});
main.innerHTML=`<div><div class="hero"><h2>🏁 Test final · ${MODS[m].t}</h2><p>${n} preguntas al azar del módulo. Necesitas un 70% para superarlo. ${st.scores[k]!=null?"Mejor nota: "+st.scores[k]+"/"+n:""}</p></div><div class="card">${n?quizHTML(qs,"f"+m):"<p class='pend'>Todavía no hay preguntas cargadas en este módulo.</p>"}</div></div>`;
if(n)bindQuiz(qs,"f"+m,ok=>{st.scores[k]=Math.max(ok,st.scores[k]||0);if(ok>=need)st.done[k]=1;save();renderNav({m,p:"final"});progress(m)});}
function bindMedia(){main.querySelectorAll(".car").forEach(c=>{const tr=c.querySelector(".track"),n=tr.children.length,d=c.querySelector(".dots");let i=0;
d.innerHTML=Array.from({length:n},(_,j)=>`<button aria-label="Diapositiva ${j+1}"></button>`).join("");const set=j=>{i=(j+n)%n;tr.style.transform=`translateX(-${i*100}%)`;d.querySelectorAll("button").forEach((b,x)=>b.classList.toggle("on",x===i))};
c.querySelector(".cp").onclick=()=>set(i-1);c.querySelector(".cn").onclick=()=>set(i+1);d.querySelectorAll("button").forEach((b,x)=>b.onclick=()=>set(x));
c.onkeydown=e=>{if(e.key==="ArrowLeft")set(i-1);if(e.key==="ArrowRight")set(i+1)};let sx=0;tr.ontouchstart=e=>sx=e.touches[0].clientX;tr.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)set(i+(dx<0?1:-1))};set(0)});

  out+=H("2. Plan de muestreo · basada en el puesto de trabajo",`<div class="tbl"><table><tr><th>G</th><th>Duración mínima acumulada (Tabla 1)</th><th>Nº de muestras</th><th>Duración de cada muestra</th></tr><tr><td>${d.G}</td><td><b>${t1.txt}</b></td><td>${d.N}</td><td><b>${fmt(t1.h)} / ${d.N} = ${fmt(per,3)} h</b> (${hm2(per)})</td></tr></table></div>${t1.big?`<div class="card warnc">⚠ G > 40: duración mínima acumulada de 17 h, o dividir el grupo.</div>`:""}<ul><li>${d.N} muestras (mínimo 5) <b>repartidas al azar</b> entre todo el GHE, todas de la misma duración.</li><li>El plan debe recoger los <b>episodios cortos de ruido intenso</b> y cómo varía el ruido a lo largo de la jornada y en los distintos lugares.</li><li>Ajustar a los equipos y personas disponibles para observar y controlar el muestreo.</li><li><b>Si la incertidumbre del muestreo supera 3,5 dB:</b> hacer más mediciones, modificar el GHE o pasar a la estrategia de jornada completa.</li></ul>`);
  if(x.puestoNoRec)W.push("Has elegido la estrategia del puesto aunque el puesto tiene pocas tareas muy ruidosas: no se recomienda.");
  CK.push(`Sortear ${d.N} muestras entre los ${d.G} trabajadores del GHE`,`Medir ${d.N} muestras de ${hm2(per)} (total ${hm2(t1.h)})`,"Incluir episodios cortos de ruido intenso y variabilidad en el tiempo y en los lugares","Calcular incertidumbre (> 3,5 dB → ampliar)");}
 if(s==="jornada"){out+=H("2. Plan de muestreo · basada en la jornada completa",`<ul><li>Usar <b>dosímetros personales</b>, que lleva puestos el propio trabajador.</li><li>Medir días <b>representativos</b> del trabajo habitual.</li><li>Inicialmente <b>3 jornadas completas</b>; si los resultados difieren <b>3 dB o más</b>, medir <b>2 jornadas más</b>.</li><li>Si no se puede medir la jornada entera: documentar los motivos y cubrirla lo máximo posible, incluyendo los periodos más ruidosos.</li><li><b>Contribuciones falsas</b> (golpes, música, voces…): minimizarlas con observación directa del trabajo, mediciones prospectivas con sonómetro, consulta a la plantilla y dosímetros que guarden el historial de la exposición (evolución temporal o registro de audio).</li></ul>`);
  CK.push("Colocar dosímetros personales en jornadas representativas","Medir 3 jornadas completas (≥ 3 dB de diferencia → 2 más)","Observar el trabajo y anotar posibles contribuciones falsas","Preguntar a la plantilla por las actividades realizadas");}
 // instrumentos
 const has=k=>d.eq.includes(k),allEst=s==="tarea"&&d.tareas.every(t=>t.tipo==="estable")&&d.imp!=="si";const ok=[],no=[];
 if(has("dos"))ok.push("Dosímetro (vale para todo tipo de ruido y todas las estrategias)");
 if(has("int"))(s==="tarea"?ok:no).push("Sonómetro integrador promediador"+(s==="tarea"?" (todo tipo de ruido, estrategia de tarea)":": solo sirve para la estrategia basada en la tarea"));
 if(has("conv"))(allEst?ok:no).push("Sonómetro convencional"+(allEst?" (ruido estable, estrategia de tarea)":": solo sirve para ruido estable y estrategia basada en la tarea"));
 if(!ok.length)W.push("Ninguno de los equipos disponibles encaja con esta estrategia según la Tabla 7."+(s==="jornada"?" La jornada completa requiere dosímetros personales.":" Necesitas al menos un dosímetro"+(s==="tarea"?" o un sonómetro integrador promediador.":".")));
 if(s==="jornada"&&!has("dos")&&ok.length)W.push("La estrategia de jornada completa requiere dosímetros personales.");
 if(d.clase==="otra")W.push("Los instrumentos deben ser como mínimo de clase 2 (Anexo III del RD 286/2006). Comprueba la clase antes de medir.");
 if(d.cal==="no")W.push("No dispones de calibrador: el art. 6 del RD 286/2006 obliga a comprobar el instrumento con un calibrador acústico antes y después de cada medición o serie de mediciones.");
 out+=H("3. Instrumentos (Tabla 7)",`<div class="tbl"><table><tr><th>Instrumento</th><th>Tipo de ruido</th><th>Estrategia</th><th>Norma</th></tr><tr class="${has("dos")?"hlrow":""}"><td>Dosímetro</td><td>Todo tipo</td><td>Todas</td><td>UNE EN 61252 (A1 y A2) · hasta 4000 Hz, o sin límite si cumple UNE EN 61672</td></tr><tr class="${has("int")?"hlrow":""}"><td>Sonómetro integrador promediador</td><td>Todo tipo</td><td>Tarea</td><td>UNE EN 61672-1</td></tr><tr class="${has("conv")?"hlrow":""}"><td>Sonómetro convencional</td><td>Estable</td><td>Tarea</td><td>UNE EN 61672-1</td></tr></table></div><p><b>Válidos para este plan:</b> ${ok.length?ok.join("; "):"ninguno de los disponibles"}.</p>${no.length?`<p><b>No adecuados:</b> ${no.join("; ")}.</p>`:""}<ul><li>Clase mínima: <b>clase 2</b> (clase 1 ≈ ±1 dB; clase 2 ≈ ±2 dB). Tus equipos: ${d.clase==="otra"?"clase sin confirmar":"clase "+d.clase}.</li>${d.imp==="si"?"<li><b>Hay ruido de impacto:</b> medir también el nivel de pico (Lpico, en dB(C)).</li>":""}${has("dos")?"<li>Aunque se mida con dosímetros, tomar con un sonómetro integrador referencias del ruido de las distintas fuentes para comprobar que los resultados son coherentes.</li>":""}<li><b>Calibración in situ</b> con calibrador acústico antes y después de cada medición o serie. Si la desviación supera lo admitido por el fabricante (en general más de <b>0,5 dB</b>): desechar las mediciones y enviar el equipo a reparar y verificar.</li></ul>`);
 if(d.imp==="si")CK.push("Registrar Lpico (dB(C)) además de LAeq");
 if(has("dos")&&has("int"))CK.push("Tomar referencias de las fuentes con el sonómetro integrador");
 CK.unshift("Comprobar el instrumento con el calibrador ANTES de medir");CK.push("Comprobar con el calibrador DESPUÉS (desviación > 0,5 dB → desechar)","Calcular la incertidumbre con la calculadora del INSST");
 out+=H("4. Después de medir: incertidumbre y valoración",`<p>Calcular la incertidumbre según la estrategia y el equipo con la herramienta del INSST:</p><a class="btn linkbtn noprint-url" href="https://herramientasprl.insst.es/higiene/evaluacion-de-la-exposicion-al-ruido" target="_blank" rel="noopener">🧮 Calculadora de evaluación de la exposición al ruido del INSST ↗</a><p class="purl">https://herramientasprl.insst.es/higiene/evaluacion-de-la-exposicion-al-ruido</p><div class="card key">⚠️ Puede no funcionar bien en algunos navegadores. Si no carga o falla en Chrome, ábrela con Firefox.</div><div class="tbl"><table><tr><th>Valor (RD 286/2006)</th><th>LAeq,d</th><th>Lpico</th><th>Consecuencias</th></tr><tr><td>Valor inferior de acción</td><td>80 dB(A)</td><td>135 dB(C)</td><td>Protectores auditivos a disposición; audiometría al menos cada 5 años</td></tr><tr><td>Valor superior de acción</td><td>85 dB(A)</td><td>137 dB(C)</td><td>Uso obligatorio de protectores; audiometría al menos cada 3 años</td></tr><tr><td>Valor límite de exposición</td><td>87 dB(A)</td><td>140 dB(C)</td><td>No se puede superar nunca (aquí sí se tiene en cuenta la atenuación del protector)</td></tr></table></div>`);
 if(W.length)out=out.replace('<section class="ps">',`<div class="card warnc"><b>⚠ Avisos</b><ul>${W.map(w=>`<li>${w}</li>`).join("")}</ul></div><section class="ps">`);
 out+=H("5. Checklist para el día de la medición",`<ul class="ck2">${CK.map(c=>`<li><label><input type="checkbox"> ${c}</label></li>`).join("")}</ul>`);
 return out}
let W3=st.wiz||{i:0,d:{}};
const visible=()=>STEPS.map((s,i)=>i).filter(i=>!STEPS[i].show||STEPS[i].show(W3.d));
function planner(){if(W3.done&&st.plan)return showPlan();const vis=visible();if(!vis.includes(W3.i))W3.i=vis.find(i=>i>W3.i)??vis[0];const S=STEPS[W3.i],pos=vis.indexOf(W3.i);
 main.innerHTML=`<div><span class="tag">Módulo 3 · Planificador</span><h2>🧭 Planificador de la medición de ruido</h2><div class="wz card"><div class="wzp"><span>Paso ${pos+1} de ${vis.length}</span><div class="prog" style="display:block;max-width:none;flex:1"><i style="width:${Math.round(pos/vis.length*100)}%"></i></div></div><h3>${S.q} <button class="info" aria-label="Ayuda" aria-expanded="false">ℹ️</button></h3><div class="helpbox" hidden>${S.help[0]} <a class="refl" href="#">📖 Ver ${REF[S.help[1]][2]}</a></div>${S.sub?`<p style="color:var(--mut)">${S.sub}</p>`:""}<div id="wzb">${S.r(W3.d)}</div><p class="warn" id="wze"></p><div class="pn"><button id="wback" ${pos?"":"disabled"}>◀ Atrás</button><button class="btn" id="wnext">${pos===vis.length-1?"Generar plan ✔":"Siguiente ▶"}</button></div></div>${st.plan?`<p><a href="#" id="lastp">Ver el último plan guardado</a></p>`:""}</div>`;
 const keep=()=>{st.wiz=W3;save()};
 main.querySelector(".info").onclick=e=>{const h=main.querySelector(".helpbox");h.hidden=!h.hidden;e.target.setAttribute("aria-expanded",!h.hidden)};
 main.querySelector(".refl").onclick=e=>{e.preventDefault();keep();const r=REF[S.help[1]];go({m:r[0],p:r[1]})};
 main.querySelectorAll(".chip input").forEach(inp=>inp.onchange=()=>{main.querySelectorAll(`input[name=${inp.name}]`).forEach(o=>o.parentElement.classList.toggle("sel",o.checked));if(S.id==="estr"){S.rd(W3.d);planner()}});
 if(S.id==="tareas"){const bindRows=()=>{main.querySelectorAll(".trow").forEach((r,i)=>{r.querySelector(".tt").onchange=e=>r.querySelector(".tcw").hidden=e.target.value!=="ciclico";r.querySelector(".rmt").onclick=()=>{STEPS[W3.i].rd(W3.d);W3.d.tareas=(W3.d.tareas||[]).filter((_,j)=>j!==i);planner()}})};bindRows();
  $("#addt").onclick=()=>{const tl=$("#tl");tl.insertAdjacentHTML("beforeend",tareaRow({n:"",min:"",tipo:"estable",ciclo:""},tl.children.length));bindRows()}}
 if($("#lastp"))$("#lastp").onclick=e=>{e.preventDefault();W3.done=true;keep();showPlan()};
 $("#wback").onclick=()=>{S.rd(W3.d);W3.i=visible().filter(i=>i<W3.i).pop();keep();planner()};
 $("#wnext").onclick=()=>{const err=S.rd(W3.d);if(err){$("#wze").textContent=err;return}keep();if(visible().find(i=>i>W3.i)===undefined){st.plan={d:JSON.parse(JSON.stringify(W3.d)),at:new Date().toLocaleString("es-ES")};st.done["2-plan"]=1;W3.done=true;keep();renderNav({m:2,p:"plan"});progress(2);showPlan()}else{W3.i=visible().find(i=>i>W3.i);keep();planner()}};
 const f=main.querySelector("#wzb input:not([type=radio]):not([type=checkbox])");if(f)f.focus({preventScroll:true});}
function showPlan(){const p=st.plan;main.innerHTML=`<div id="plan" class="view">${buildPlan(p.d)}<p class="pfoot">Generado con el planificador del curso «El ruido en el trabajo» · ${esc(p.at)}. Criterios: RD 286/2006, UNE-EN ISO 9612 y contenido de los Módulos 1 y 2.</p><div class="pn noprint"><button id="pedit">✏️ Modificar respuestas</button><span><button class="btn" id="pprint">🖨️ Imprimir / Guardar PDF</button> <button id="preset">↺ Empezar de nuevo</button></span></div></div>`;
 $("#pprint").onclick=()=>print();$("#preset").onclick=()=>{if(confirm("¿Empezar un plan nuevo? El plan guardado se mantiene hasta que generes otro.")){W3={i:0,d:{}};st.wiz=W3;save();planner()}};
 $("#pedit").onclick=()=>{W3={i:0,d:JSON.parse(JSON.stringify(p.d))};st.wiz=W3;save();planner()};}

if(location.hash==="#m3")location.hash="#m3-plan";
const hm=location.hash.match(/^#(home|m3-plan|m([12])-(l([1-9])|final))$/);
go(hm?(hm[1]==="home"?{p:"home"}:hm[1]==="m3-plan"?{m:2,p:"plan"}:{m:+hm[2]-1,p:hm[3]==="final"?"final":+hm[4]-1}):parse(st.last));
</script>
